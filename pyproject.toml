
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-assistant"
version = "0.1.0"
description = "An AI research assistant for collecting and understanding research papers"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "SQLAlchemy",
    "numpy",
    "faiss-cpu",
    "sentence-transformers",
    "PyMuPDF",
    "google-genai",
    "python-dotenv",
    "tiktoken",
    "fastapi",
    "uvicorn",
    "prefect",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
